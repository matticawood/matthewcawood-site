# Brand site build: regenerate the Monday Music Tips archive + article pages from
# Supabase on every deploy / build-hook trigger.
[build]
  command = "node build/generate.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Old Shopify store subdomain → new storefront.
# store.matthewcawood.com is added as a domain alias on this Netlify site; all of
# its traffic 301s to /store/. Shopify paths (/products, /collections) don't map
# to the new store, so everything lands on the storefront root rather than 404.
[[redirects]]
  from = "https://store.matthewcawood.com/*"
  to = "https://matthewcawood.com/store/"
  status = 301
  force = true

[[redirects]]
  from = "http://store.matthewcawood.com/*"
  to = "https://matthewcawood.com/store/"
  status = 301
  force = true

# Old Squarespace mailing-list path (lives in every YouTube description) → the
# "Join Monday Music Tips" signup on the homepage. 302 so it isn't hard-cached,
# in case this later gets its own dedicated landing page.
[[redirects]]
  from = "/mailing-list-sign-up"
  to = "/#subscribe"
  status = 302

[[redirects]]
  from = "/mailing-list-sign-up/*"
  to = "/#subscribe"
  status = 302
